<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Floating Network Nodes & Grid (Background element) -->
  <g opacity="0.15">
    <path d="M0,50 Q300,120 600,50 T1200,80" fill="none" stroke="#a855f7" stroke-width="2">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0,50 Q300,120 600,50 T1200,80; M0,80 Q300,30 600,90 T1200,40; M0,50 Q300,120 600,50 T1200,80" />
    </path>
    <path d="M0,220 Q400,150 800,230 T1200,180" fill="none" stroke="#6366f1" stroke-width="2">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0,220 Q400,150 800,230 T1200,180; M0,190 Q400,260 800,170 T1200,210; M0,220 Q400,150 800,230 T1200,180" />
    </path>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.18" filter="url(#glow)">
    <animate attributeName="r" dur="6s" repeatCount="indefinite" values="120;140;120" />
  </circle>
  <circle cx="1050" cy="220" r="130" fill="#ec4899" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" dur="8s" repeatCount="indefinite" values="130;110;130" />
  </circle>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent-grad)" />

  <!-- Foreground Title and Subtitle -->
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="url(#text-grad)" letter-spacing="1">
    AWESOME MARKETPLACE MANAGEMENT
  </text>
  
  <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#a5b4fc" letter-spacing="0.5">
    Curated SaaS Platforms, Multi-Channel Listing, Inventory Sync &amp; Open-Source Projects
  </text>

  <!-- Decorative Pills / Tags -->
  <g transform="translate(360, 215)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="70" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">🛒 Multi-Channel</text>

    <rect x="155" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="235" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e9d5ff">⚡ Inventory Sync</text>

    <rect x="330" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="405" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fbcfe8">🌐 Open Source</text>
  </g>
</svg>
